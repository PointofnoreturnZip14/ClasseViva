<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClasseFica</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#1b2430;--mu:#6b7686;--pr:#b3202a;--hd:#b3202a;--ok:#1e9e55;--ko:#d33a3a;--wa:#e8890c;--bd:#dde3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mu:#98a3b3;--pr:#ff6b6b;--bd:#2a3340}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mu:#98a3b3;--pr:#ff6b6b;--bd:#2a3340}
:root.doc{--hd:#6a2fb0;--pr:#7d3fd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{background:var(--hd);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;transition:background .3s}
#logo{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--hd);font-weight:800;display:grid;place-items:center;position:relative;user-select:none;-webkit-user-select:none;touch-action:none;flex:none}
#logo svg{position:absolute;inset:-4px;width:52px;height:52px;transform:rotate(-90deg);pointer-events:none}
#logo circle{fill:none;stroke:#ffb400;stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151}
#logo.hold circle{animation:ring 3s linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
header h1{font-size:17px;margin:0;line-height:1.2}header small{opacity:.85;font-size:12px}
.badge{margin-left:auto;background:#ffb400;color:#222;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}
#bn{background:#ffb400;color:#222;font-weight:700;font-size:13px;overflow:hidden;white-space:nowrap;padding:7px 0;cursor:pointer;flex:none}
#bn span{display:inline-block;padding-left:100%;animation:sc 14s linear infinite}
@keyframes sc{to{transform:translateX(-100%)} }
main{flex:1;overflow:auto;padding:12px}
nav{display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:0 0 auto;min-width:64px;border:0;background:none;color:var(--mu);padding:8px 0 6px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--pr);font-weight:700}
.card{background:var(--card);border-radius:6px;padding:12px;margin-bottom:10px;border:1px solid var(--bd)}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.g{min-width:42px;height:42px;border-radius:10px;color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px;flex:none}
.ok{background:var(--ok)}.ko{background:var(--ko)}.wa{background:var(--wa)}
.grow{flex:1;min-width:0}.mu{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:30px;font-weight:800}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--bd);color:var(--tx);font-weight:600}
.tag.r{background:var(--ko);color:#fff}.tag.v{background:#2d7fd3;color:#fff}.tag.a{background:var(--wa);color:#fff}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:#ffb400;color:#222;font-size:28px;box-shadow:0 4px 14px #0005;z-index:5}
select,input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.btn{border:0;background:var(--pr);color:#fff;padding:11px 16px;border-radius:8px;font:inherit;font-weight:700}
.btn.s{background:var(--bd);color:var(--tx)}
.x{border:0;background:none;color:var(--ko);font-size:18px}
#mod{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}
#mod.on{display:flex}#mod>div{background:var(--card);width:100%;max-width:640px;margin:0 auto;padding:16px;border-radius:16px 16px 0 0;max-height:85%;overflow:auto}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:30;pointer-events:none}#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
<header>
<div id="logo"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/></svg><span id="lt">CF</span></div>
<div id="hd" style="cursor:pointer"><h1 id="ht"></h1><small id="hs"></small></div><span class="badge" id="bd" hidden>DOCENTE</span>
</header>
<div id="bn"><span>ATTENZIONE: questa app NON è ClasseViva, è solo uno scherzo! Vai nella sezione VERITÀ per scoprire la verità      •      APP NON UFFICIALE: tocca qui per andare in VERITÀ</span></div>
<main id="m"></main>
<nav id="nv"></nav>
</div>
<button class="fab" id="fab" hidden>+</button>
<div id="mod"><div id="mc"></div></div>
<div id="toast"></div>
<script>
const SUBJ=["Italiano","Matematica","Inglese","Storia","Scienze","Informatica","Ed. Fisica"];
const KEY="rv_state_v2";
const d=(n)=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
let S;
const seed=()=>({teacher:false,sid:1,
students:[{id:1,n:"Marco Rossi"},{id:2,n:"Giulia Bianchi"},{id:3,n:"Luca Verdi"},{id:4,n:"Sara Neri"}],
grades:[[1,"Matematica",7.5,-2,"Scritto","Equazioni"],[1,"Italiano",6,-4,"Orale","Promessi Sposi"],[1,"Inglese",8,-6,"Scritto","Present perfect"],[1,"Storia",5.5,-8,"Orale","Rivoluzione francese"],[1,"Informatica",9,-3,"Pratico","HTML e CSS"],[1,"Matematica",4.5,-14,"Scritto","Disequazioni"],[2,"Matematica",8,-2,"Scritto","Equazioni"],[2,"Italiano",7,-4,"Orale","Manzoni"],[3,"Matematica",6,-2,"Scritto","Equazioni"],[3,"Inglese",5,-6,"Scritto","Present perfect"],[4,"Italiano",9,-4,"Orale","Manzoni"]].map((g,i)=>({id:i+1,sid:g[0],subj:g[1],v:g[2],date:d(g[3]),type:g[4],desc:g[5]})),
notes:[{id:1,sid:1,date:d(-5),kind:"Nota disciplinare",text:"Disturba la lezione ripetutamente.",by:"Prof. Esposito"},{id:2,sid:1,date:d(-1),kind:"Annotazione",text:"Non ha svolto i compiti assegnati.",by:"Prof.ssa Conti"}],
agenda:[{id:1,date:d(1),subj:"Matematica",kind:"Verifica",text:"Verifica su sistemi di equazioni"},{id:2,date:d(2),subj:"Italiano",kind:"Compito",text:"Leggere cap. 8-9 e riassunto"},{id:3,date:d(3),subj:"Inglese",kind:"Compito",text:"Esercizi pag. 112 n. 1-6"},{id:4,date:d(5),subj:"Storia",kind:"Verifica",text:"Interrogazione Napoleone"},{id:5,date:d(0),subj:"Scienze",kind:"Lezione",text:"La cellula: struttura e funzioni"}],
abs:[{id:1,sid:1,date:d(-9),kind:"Assenza",ok:true},{id:2,sid:1,date:d(-3),kind:"Ritardo",ok:false},{id:3,sid:2,date:d(-3),kind:"Assenza",ok:false}]});
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.grades){S=seed();S.students=[{id:1,n:"Studente 1"}];S.grades=[];S.notes=[];S.agenda=[];S.abs=[];S.bach=[];S.app="ClasseFica";S.school="";S.cls="3B";S.ay="2026/27";S.logo="CF"}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let view="dash";
const $=s=>document.querySelector(s);
const nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const fd=s=>new Date(s+"T12:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
const gc=v=>v>=6?"ok":v>=5?"wa":"ko";
const avg=a=>a.length?a.reduce((s,x)=>s+x.v,0)/a.length:0;
const f1=v=>v?v.toFixed(1).replace(".",","):"–";
const stu=()=>S.students.find(s=>s.id==S.sid);
const mine=a=>a.filter(x=>x.sid==S.sid);
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=[["dash","🏠","Home"],["voti","📊","Voti"],["agenda","📅","Agenda"],["note","📝","Note"],["abs","🕒","Assenze"],["ora","🗓️","Orario"],["pag","🎓","Pagella"],["bach","📢","Bacheca"],["ver","ℹ️","Verità"]];

const ic=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={dash:ic('<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>'),voti:ic('<path d="M5 20V10M12 20V4M19 20v-7"/>'),agenda:ic('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),note:ic('<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>'),abs:ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),ora:ic('<rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 4v16"/>'),pag:ic('<path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c3 2 7 2 10 0v-5"/>'),bach:ic('<path d="M4 10v4h4l7 4V6L8 10z"/><path d="M18 9a4 4 0 010 6"/>'),ver:ic('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>')};
const info=()=>[S.app||"ClasseFica",S.school,S.cls?"Classe "+S.cls:"",S.ay?"A.S. "+S.ay:""].filter(Boolean).join(" • ");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function render(){
 document.documentElement.classList.toggle("doc",S.teacher);
 document.title=S.app||"ClasseFica";$("#lt").textContent=S.logo||"CF";$("#bd").hidden=!S.teacher;$("#fab").hidden=!S.teacher||["dash","ver","ora","pag"].includes(view);
 $("#ht").textContent=S.teacher?"Area Docente":stu().n;
 $("#hs").textContent=S.teacher?info()+" – "+stu().n:info();
 $("#nv").innerHTML=T.map(t=>`<button class="${view==t[0]?"on":""}" data-v="${t[0]}"><span>${IC[t[0]]}</span>${t[2]}</button>`).join("");
 let h="";
 if(S.teacher)h+=`<div class="card"><h3>Studente selezionato</h3><select id="ss">${S.students.map(s=>`<option value="${s.id}" ${s.id==S.sid?"selected":""}>${esc(s.n)}</option>`).join("")}</select><button class="btn s" id="as">Aggiungi studente</button></div>`;
 h+=({dash,voti,agenda,note,abs,ora,pag,bach,ver})[view]();
 $("#m").innerHTML=h;
 const as=$("#as");if(as)as.onclick=()=>form("Nuovo studente",[{k:"n",l:"Nome e cognome",r:1}],v=>{const id=nid(S.students);S.students.push({id,n:v.n.slice(0,40)});S.sid=id});
 const ss=$("#ss");if(ss)ss.onchange=()=>{S.sid=+ss.value;save();render()};
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.del.split(":");S[k]=S[k].filter(x=>x.id!=id);save();render()});
 document.querySelectorAll("[data-bd]").forEach(b=>b.onclick=()=>{S.bach.splice(+b.dataset.bd,1);save();render()});
 document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const a=S.abs.find(x=>x.id==b.dataset.tg);a.ok=!a.ok;save();render()});
}
const del=(k,id)=>S.teacher?`<button class="x" data-del="${k}:${id}">&#10005;</button>`:"";
function dash(){
 const g=mine(S.grades),n=mine(S.notes),a=mine(S.abs);
 const up=S.agenda.filter(x=>x.date>=d(0)&&x.kind!="Lezione").sort((x,y)=>x.date<y.date?-1:1).slice(0,3);
 let h=`<div class="grid"><div class="card"><div class="mu">Media generale</div><div class="big" style="color:var(--${gc(avg(g))=="ok"?"ok":gc(avg(g))=="wa"?"wa":"ko"})">${f1(avg(g))}</div></div>
 <div class="card"><div class="mu">Assenze</div><div class="big">${a.filter(x=>x.kind=="Assenza").length}</div><div class="mu">${a.filter(x=>!x.ok).length} da giustificare</div></div>
 <div class="card"><div class="mu">Note</div><div class="big">${n.length}</div></div>
 <div class="card"><div class="mu">Voti inseriti</div><div class="big">${g.length}</div></div></div>`;
 h+=`<div class="card"><h3>Ultimi voti</h3>${g.sort((x,y)=>x.date<y.date?1:-1).slice(0,3).map(x=>`<div class="row"><div class="g ${gc(x.v)}">${f1(x.v)}</div><div class="grow"><b>${x.subj}</b><div class="mu">${fd(x.date)} • ${x.type}</div></div></div>`).join("")||"<div class=mu>Nessun voto</div>"}</div>`;
 h+=`<div class="card"><h3>Prossimi impegni</h3>${up.map(x=>`<div class="row"><span class="tag ${x.kind=="Verifica"?"r":"v"}">${x.kind}</span><div class="grow"><b>${x.subj}</b><div class="mu">${fd(x.date)} – ${esc(x.text)}</div></div></div>`).join("")||"<div class=mu>Niente in programma</div>"}</div>`;
 if(S.teacher){h+=`<div class="card"><h3>Medie della classe</h3>${S.students.map(s=>{const m=avg(S.grades.filter(x=>x.sid==s.id));return`<div class="row"><div class="g ${gc(m)}">${f1(m)}</div><div class="grow"><b>${esc(s.n)}</b></div></div>`}).join("")}</div>`}
 return h}
function voti(){
 const g=mine(S.grades);
 return SUBJ.map(s=>{const l=g.filter(x=>x.subj==s).sort((x,y)=>x.date<y.date?1:-1);if(!l.length&&!S.teacher)return"";
 return`<div class="card"><div class="row" style="border:0;padding-top:0"><div class="grow"><b>${s}</b></div><div class="g ${gc(avg(l))}">${f1(avg(l))}</div></div>${l.map(x=>`<div class="row"><div class="g ${gc(x.v)}" style="min-width:36px;height:36px;font-size:14px">${f1(x.v)}</div><div class="grow">${esc(x.desc||x.type)}<div class="mu">${fd(x.date)} • ${x.type}</div></div>${del("grades",x.id)}</div>`).join("")}</div>`}).join("")||'<div class="card mu">Nessun voto</div>'}
function agenda(){
 const l=[...S.agenda].sort((x,y)=>x.date<y.date?-1:1);const days=[...new Set(l.map(x=>x.date))];
 return days.map(dt=>`<div class="card"><h3>${fd(dt)}${dt==d(0)?" • oggi":""}</h3>${l.filter(x=>x.date==dt).map(x=>`<div class="row"><span class="tag ${x.kind=="Verifica"?"r":x.kind=="Compito"?"a":"v"}">${x.kind}</span><div class="grow"><b>${x.subj}</b><div class="mu">${esc(x.text)}</div></div>${del("agenda",x.id)}</div>`).join("")}</div>`).join("")||'<div class="card mu">Agenda vuota</div>'}
function note(){
 const l=mine(S.notes).sort((x,y)=>x.date<y.date?1:-1);
 return l.map(x=>`<div class="card"><div class="row" style="border:0;padding:0 0 6px"><span class="tag ${x.kind[0]=="N"?"r":"a"}">${x.kind}</span><div class="grow mu" style="text-align:right">${fd(x.date)}</div>${del("notes",x.id)}</div>${esc(x.text)}<div class="mu" style="margin-top:6px">${esc(x.by)}</div></div>`).join("")||'<div class="card mu">Nessuna nota</div>'}
function abs(){
 const l=mine(S.abs).sort((x,y)=>x.date<y.date?1:-1);
 return`<div class="card">${l.map(x=>`<div class="row"><span class="tag ${x.kind=="Assenza"?"r":"a"}">${x.kind}</span><div class="grow">${fd(x.date)}</div>${x.ok?'<span class="tag" style="background:var(--ok);color:#fff">Giustificata</span>':'<span class="tag">Da giustificare</span>'}${S.teacher||!x.ok?`<button class="btn s" data-tg="${x.id}" style="padding:6px 10px">${x.ok?"Annulla":"Giustifica"}</button>`:""}${del("abs",x.id)}</div>`).join("")||'<div class="mu">Nessuna assenza</div>'}</div>`}

function ora(){
 const O={"Lunedì":["Italiano","Matematica","Inglese","Storia","Scienze","Ed. Fisica"],"Martedì":["Informatica","Informatica","Italiano","Matematica","Inglese","Storia"],"Mercoledì":["Scienze","Italiano","Matematica","Ed. Fisica","Inglese","Informatica"],"Giovedì":["Storia","Matematica","Italiano","Scienze","Inglese","Ed. Fisica"],"Venerdì":["Matematica","Informatica","Storia","Italiano","Scienze","Inglese"]};
 return Object.entries(O).map(([g,l])=>`<div class="card"><h3>${g}</h3>${l.map((m,i)=>`<div class="row"><span class="tag">${i+8}:00</span><div class="grow"><b>${m}</b></div></div>`).join("")}</div>`).join("")}
function pag(){
 const g=mine(S.grades);
 return `<div class="card"><h3>Pagella – 1° quadrimestre</h3>${SUBJ.map(s=>{const m=avg(g.filter(x=>x.subj==s));return`<div class="row"><div class="grow"><b>${s}</b><div class="mu">Media ${f1(m)}</div></div><div class="g ${m?gc(Math.round(m)):""}" ${m?"":'style="background:var(--bd);color:var(--mu)"'}>${m?Math.round(m):"–"}</div></div>`}).join("")}</div><div class="card"><h3>Esito provvisorio</h3><div class="big">${f1(avg(g))}</div><div class="mu">Media generale dei voti inseriti</div></div>`}
function bach(){
 return (S.bach||[]).map((c,i)=>`<div class="card"><div class="row" style="border:0;padding:0 0 6px"><span class="tag v">${esc(c[1])}</span><div class="grow mu" style="text-align:right">${fd(c[0])}</div>${S.teacher?`<button class="x" data-bd="${i}">&#10005;</button>`:""}</div><b>${esc(c[2])}</b><div class="mu" style="margin-top:4px">${esc(c[3])}</div></div>`).join("")||'<div class="card mu">Nessuna comunicazione</div>'}
function ver(){
 return `<div class="card"><h3>La verità</h3><p style="margin:0 0 10px"><b>Questa app è totalmente uno scherzo.</b> È una parodia dimostrativa, creata per divertimento.</p><p class="mu" style="margin:0 0 10px">Non è ClasseViva, non è collegata a ClasseViva né a Gruppo Spaggiari Parma e non è un registro elettronico ufficiale. Tutti i dati vengono inseriti a mano da chi la usa.</p><p class="mu" style="margin:0">Non inserire mai dati o password reali della scuola: l'app non ha login e salva tutto solo nel tuo browser.</p></div>`}
function form(title,fields,cb){
 $("#mc").innerHTML=`<h3 style="margin-top:0">${title}</h3>`+fields.map(f=>`<label class="mu">${f.l}</label>`+(f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option>${o}</option>`).join("")}</select>`:f.t=="area"?`<textarea id="f_${f.k}" rows="3"></textarea>`:`<input id="f_${f.k}" type="${f.t||"text"}" ${f.t=="number"?'step="0.25" min="0" max="10"':""} value="${esc(f.v||"")}">`)).join("")+`<div style="display:flex;gap:8px;margin-top:6px"><button class="btn s" id="fc">Annulla</button><button class="btn grow" id="fo">Salva</button></div>`;
 $("#mod").classList.add("on");
 $("#fc").onclick=()=>$("#mod").classList.remove("on");
 $("#fo").onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$("#f_"+f.k).value);if(fields.some(f=>f.r&&!v[f.k]))return toast("Compila tutti i campi");cb(v);save();$("#mod").classList.remove("on");render()};
}
$("#fab").onclick=()=>{
 if(view=="voti")form("Nuovo voto – "+stu().n,[{k:"subj",l:"Materia",o:SUBJ},{k:"v",l:"Voto (0-10)",t:"number",r:1},{k:"type",l:"Tipo",o:["Scritto","Orale","Pratico"]},{k:"desc",l:"Argomento"},{k:"date",l:"Data",t:"date",v:d(0)}],v=>S.grades.push({id:nid(S.grades),sid:S.sid,subj:v.subj,v:Math.min(10,+v.v),type:v.type,desc:v.desc,date:v.date||d(0)}));
 if(view=="agenda")form("Nuovo evento agenda",[{k:"subj",l:"Materia",o:SUBJ},{k:"kind",l:"Tipo",o:["Compito","Verifica","Lezione"]},{k:"text",l:"Descrizione",t:"area",r:1},{k:"date",l:"Data",t:"date",v:d(1)}],v=>S.agenda.push({id:nid(S.agenda),...v}));
 if(view=="note")form("Nuova nota – "+stu().n,[{k:"kind",l:"Tipo",o:["Nota disciplinare","Annotazione"]},{k:"text",l:"Testo",t:"area",r:1}],v=>S.notes.push({id:nid(S.notes),sid:S.sid,date:d(0),kind:v.kind,text:v.text,by:"Il docente"}));
 if(view=="bach")form("Nuova comunicazione",[{k:"from",l:"Mittente"},{k:"title",l:"Titolo",r:1},{k:"text",l:"Testo",t:"area"},{k:"date",l:"Data",t:"date",v:d(0)}],v=>{(S.bach=S.bach||[]).push([v.date||d(0),v.from||"Scuola",v.title,v.text])});
 if(view=="abs")form("Registra assenza – "+stu().n,[{k:"kind",l:"Tipo",o:["Assenza","Ritardo","Uscita anticipata"]},{k:"date",l:"Data",t:"date",v:d(0)}],v=>S.abs.push({id:nid(S.abs),sid:S.sid,date:v.date||d(0),kind:v.kind,ok:false}));
};
$("#nv").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;render()}};
$("#bn").onclick=()=>{view="ver";render()};
$("#hd").onclick=()=>form("Modifica informazioni",[{k:"app",l:"Nome dell'app",v:S.app||"ClasseFica",r:1},{k:"logo",l:"Logo (max 3 lettere)",v:S.logo||"CF"},{k:"school",l:"Scuola",v:S.school||""},{k:"cls",l:"Classe",v:S.cls||""},{k:"ay",l:"Anno scolastico",v:S.ay||""},{k:"stu",l:"Nome studente",v:stu().n,r:1}],v=>{S.app=v.app.slice(0,30);S.logo=v.logo.slice(0,3);S.school=v.school.slice(0,40);S.cls=v.cls.slice(0,10);S.ay=v.ay.slice(0,12);stu().n=v.stu.slice(0,40)});
$("#mod").onclick=e=>{if(e.target.id=="mod")$("#mod").classList.remove("on")};
// Pressione lunga 3s sul logo
let tm;const lg=$("#logo");
const stop=()=>{clearTimeout(tm);lg.classList.remove("hold")};
lg.addEventListener("pointerdown",e=>{e.preventDefault();lg.classList.add("hold");tm=setTimeout(()=>{stop();S.teacher=!S.teacher;save();try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}toast(S.teacher?"Modalità docente attiva":"Modalità famiglia/studente");render()},3000)});
["pointerup","pointerleave","pointercancel"].forEach(ev=>lg.addEventListener(ev,stop));
lg.addEventListener("contextmenu",e=>e.preventDefault());
render();
</script>
